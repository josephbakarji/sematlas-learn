<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1f23; --ink-dim: #5f6570; --rule: #e4e1da;
  --link: #c9c4ba; --learn: #0f9b83; --accent: #b7791f; --back: #c2410c; --dim: 0.1;
  --serif: "Source Serif 4", Georgia, serif; --sans: Inter, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --panel: #141a23; --ink: #e2e6ec; --ink-dim: #8e99a8; --rule: #253041;
  --link: #2c3647; --learn: #4fd8bd; --accent: #e0ab52; --back: #f0835a; } }
:root[data-theme="dark"] { --bg: #0d1117; --panel: #141a23; --ink: #e2e6ec; --ink-dim: #8e99a8; --rule: #253041;
  --link: #2c3647; --learn: #4fd8bd; --accent: #e0ab52; --back: #f0835a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); overflow: hidden; }
header { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 18px; padding: 14px 20px; z-index: 2; pointer-events: none; }
header > * { pointer-events: auto; }
h1 { font: 600 20px var(--serif); margin: 0; }
h1 small { font: 400 13px var(--sans); color: var(--ink-dim); margin-left: 8px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: 500 13px var(--sans); color: var(--ink-dim); background: none; border: 0; padding: 6px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg button:focus-visible, input:focus-visible, .legend li:focus-visible { outline: 2px solid var(--learn); outline-offset: 2px; }
input[type=search] { font: 13px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; width: 200px; }
label.tg { font-size: 13px; color: var(--ink-dim); display: inline-flex; gap: 6px; align-items: center; }
svg { display: block; width: 100vw; height: 100vh; cursor: grab; }
.legend { position: absolute; left: 20px; bottom: 18px; margin: 0; padding: 10px 12px; list-style: none; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--rule); border-radius: 10px; width: 300px; max-height: 42vh; overflow-y: auto; z-index: 2; }
.legend li { display: flex; gap: 8px; align-items: center; padding: 2px 4px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.legend li:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.legend li.off { opacity: 0.35; }
.legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend .n { color: var(--ink-dim); margin-left: auto; font-variant-numeric: tabular-nums; }
.legend .cap { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 4px 4px; cursor: default; }
.legend .cap:hover { background: none; }
aside { position: absolute; right: 18px; top: 64px; width: 320px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; z-index: 2; display: none; box-shadow: 0 8px 30px rgba(0,0,0,0.14); }
aside.on { display: block; }
aside h2 { font: 600 19px var(--serif); margin: 0 0 2px; }
aside .deck { font-size: 12.5px; margin-bottom: 8px; }
aside .def { font-size: 13.5px; margin: 0 0 10px; }
aside dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 13px; }
aside dt { color: var(--ink-dim); }
aside dd { margin: 0; }
aside .acts { display: flex; gap: 8px; flex-wrap: wrap; }
aside a.btn { font: 500 13px var(--sans); text-decoration: none; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rule); color: var(--ink); }
aside a.btn.go { background: var(--learn); border-color: var(--learn); color: var(--bg); }
aside .chain { font-size: 12.5px; color: var(--ink-dim); margin-top: 10px; }
aside .chain b { color: var(--ink); font-weight: 500; }
.note { position: absolute; right: 20px; bottom: 18px; font-size: 12px; color: var(--ink-dim); max-width: 400px; text-align: right; z-index: 2; }
.hull { stroke-width: 1.5; stroke-linejoin: round; pointer-events: none; }
.edge { fill: none; stroke: var(--link); stroke-width: 1; }
.edge.back { stroke: var(--back); stroke-width: 1.6; }
.edge.up { stroke: var(--accent); stroke-width: 2.2; }
.edge.down { stroke: var(--learn); stroke-width: 2.2; }
.qedge { fill: none; stroke: var(--accent); stroke-dasharray: 3 4; stroke-width: 1.2; }
.node { cursor: pointer; }
.node rect { stroke-width: 1.3; }
.node text { font: 500 12px var(--sans); fill: var(--ink); pointer-events: none; dominant-baseline: central; }
.node.big text { font-weight: 600; font-size: 13px; }
.node.dot text { display: none; }
.node.pin rect, .node:hover rect { stroke-width: 2.4; }
.q { cursor: pointer; }
.q rect { fill: var(--accent); }
.q text { font: italic 600 13.5px var(--serif); fill: var(--bg); dominant-baseline: central; pointer-events: none; }
.faded { opacity: var(--dim); }
.ring { fill: none; stroke: var(--ink-dim); stroke-opacity: 0.3; stroke-dasharray: 2 5; }
.axis text { font: 600 13px var(--sans); fill: var(--ink-dim); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 720px) { header { flex-wrap: wrap; gap: 8px; } aside { left: 16px; right: 16px; width: auto; } .legend { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Concept Map <small>both courses, as one graph of ideas</small></h1>
  <div class="seg" role="tablist" aria-label="Layout">
    <button data-l="web" class="on" title="Lectures that share many concepts sit close; each concept settles around its lecture">Web</button>
    <button data-l="time" title="Left to right in course order; a red link is a prerequisite taught later than the concept that needs it">Timeline</button>
    <button data-l="depth" title="Basics at the centre, the frontier at the edge: radius is the longest prerequisite chain">Depth</button>
  </div>
  <input type="search" id="q" placeholder="Find a concept" aria-label="Find a concept">
  <label class="tg"><input type="checkbox" id="stories" checked> story decks</label>
</header>
<svg id="map" role="img" aria-label="Graph of course concepts and their prerequisites"></svg>
<ul class="legend" id="legend"></ul>
<aside id="panel" aria-live="polite"></aside>
<p class="note" id="note">Zoom in to see every concept; zoomed out, the most connected ones carry the labels. Hover a concept to trace it back to the basics (gold) and forward to what it unlocks (teal); click to pin it.</p>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
(async function () {
  const BAKE = /bake/.test(location.search);
  const G = await (await fetch('graph.json')).json();
  let L = null; if (!BAKE) try { L = await (await fetch('layout.json', { cache: 'no-store' })).json(); } catch (e) { L = null; }
  const svg = d3.select('#map'), root = svg.append('g'), W = innerWidth, H = innerHeight;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light';

  // ---------- data
  const decks = G.decks, di = Object.fromEntries(decks.map(d => [d.id, d.i]));
  const inCourse = {}; decks.forEach(d => { (inCourse[d.course] = inCourse[d.course] || []).push(d.id); });
  const col = id => { const d = decks[di[id]], list = inCourse[d.course], t = list.length > 1 ? list.indexOf(id) / (list.length - 1) : 0;
    return d3.hsl(d.course === 'intro_ml' ? 200 + 120 * t : 20 + 140 * t, dark ? 0.62 : 0.55, dark ? 0.64 : 0.42).formatHex(); };
  const N = G.nodes.map(d => ({ ...d })), byId = new Map(N.map(d => [d.id, d]));
  const E = G.edges.map(e => ({ source: byId.get(e.source), target: byId.get(e.target) }));
  N.forEach(d => { d.pre = []; d.post = []; });
  E.forEach(e => { e.target.pre.push(e.source); e.source.post.push(e.target); e.back = di[e.source.deck] > di[e.target.deck]; });
  N.forEach(d => { d.deg = d.pre.length + d.post.length + d.uses; });
  const depth = d => d._depth ?? (d._depth = d.pre.length ? 1 + d3.max(d.pre, depth) : 0); N.forEach(depth);
  const Q = G.questions.map(q => ({ ...q, q: true })), QE = Q.flatMap(q => q.teaches.map(k => ({ source: q, target: byId.get(k) })).filter(e => e.target));
  const ALL = N.concat(Q);
  const ranked = N.slice().sort((a, b) => b.deg - a.deg); ranked.forEach((d, i) => { d.rank = i; });   // which labels survive zoomed out

  // ---------- drawing (sizes come from the measured text)
  const hullG = root.append('g'), edgeG = root.append('g'), qeG = root.append('g'), axisG = root.append('g').attr('class', 'axis'), nodeG = root.append('g'), qG = root.append('g');
  svg.append('defs').selectAll('marker').data(['link', 'back', 'up', 'down']).join('marker').attr('id', d => 'm-' + d)
    .attr('viewBox', '0 -4 8 8').attr('refX', 8).attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', d => css({ link: '--link', back: '--back', up: '--accent', down: '--learn' }[d]));
  const tint = c => d3.interpolateRgb(css('--bg'), c)(dark ? 0.24 : 0.16);
  const node = nodeG.selectAll('g').data(N).join('g').attr('class', d => 'node' + (d.deg >= 6 ? ' big' : ''));
  node.append('rect'); node.append('text').attr('text-anchor', 'middle').text(d => d.name);
  node.each(function (d) { d.w = this.querySelector('text').getComputedTextLength() + 18; d.h = d.deg >= 6 ? 26 : 22; })
    .select('rect').attr('fill', d => tint(col(d.deck))).attr('stroke', d => col(d.deck));
  const qn = qG.selectAll('g').data(Q).join('g').attr('class', 'q').on('click', (e, d) => open(d.url, '_blank'));
  qn.append('rect'); qn.append('text').attr('text-anchor', 'middle').text(d => '★  ' + d.question);
  qn.each(function (d) { d.w = this.querySelector('text').getComputedTextLength() + 26; d.h = 30; }).select('rect')
    .attr('x', d => -d.w / 2).attr('y', d => -d.h / 2).attr('width', d => d.w).attr('height', d => d.h).attr('rx', 8);

  // ---------- layouts: computed once, offline (bake.py writes layout.json); the page never simulates
  function rectCollide(pad, vertical) {
    let nodes;
    const force = () => { for (let pass = 0; pass < 2; pass++) {
      const qt = d3.quadtree(nodes, d => d.x, d => d.y), mw = d3.max(nodes, d => d.w), mh = d3.max(nodes, d => d.h);
      for (const a of nodes) qt.visit((q, x0, y0, x1, y1) => {
        const b = q.data;
        if (b && b !== a) { const dx = b.x - a.x, dy = b.y - a.y, ox = (a.w + b.w) / 2 + pad - Math.abs(dx), oy = (a.h + b.h) / 2 + pad - Math.abs(dy);
          if (ox > 0 && oy > 0) { if (!vertical && ox / (a.w + b.w) < oy / (a.h + b.h)) { const m = (dx < 0 ? -1 : 1) * ox / 2; a.x -= m; b.x += m; } else { const m = (dy < 0 ? -1 : 1) * (oy / 2 + 0.01); a.y -= m; b.y += m; } } }
        return x0 > a.x + (a.w + mw) / 2 + pad || x1 < a.x - (a.w + mw) / 2 - pad || y0 > a.y + (a.h + mh) / 2 + pad || y1 < a.y - (a.h + mh) / 2 - pad; });
    } };
    force.initialize = ns => { nodes = ns; }; return force;
  }
  const SPAN = Math.sqrt(N.length) * 120;   // the canvas grows with the number of concepts
  function compute(mode) {
    if (mode === 'web') {   // first the lectures, as a graph weighted by the links between them
      const w = {}; E.forEach(e => { const a = e.source.deck, b = e.target.deck; if (a !== b) { const k = a < b ? a + '|' + b : b + '|' + a; w[k] = (w[k] || 0) + 1; } });
      const DN = decks.map(d => ({ id: d.id, n: N.filter(x => x.deck === d.id).length, x: (d.course === 'intro_ml' ? -1 : 1) * SPAN * 0.4 + (Math.random() - 0.5) * 50, y: (Math.random() - 0.5) * SPAN * 0.4 }));
      const dm = new Map(DN.map(d => [d.id, d])), DL = Object.entries(w).map(([k, v]) => ({ source: dm.get(k.split('|')[0]), target: dm.get(k.split('|')[1]), w: v }));
      d3.forceSimulation(DN).stop().force('link', d3.forceLink(DL).distance(d => 420 / Math.sqrt(d.w)).strength(d => Math.min(1, d.w / 12)))
        .force('charge', d3.forceManyBody().strength(d => -1800 - 260 * d.n)).force('collide', d3.forceCollide(d => 60 + 22 * Math.sqrt(d.n)))
        .force('x', d3.forceX(0).strength(0.06)).force('y', d3.forceY(0).strength(0.08)).tick(600);
      const centre = d => dm.get(d.deck);
      ALL.forEach(d => { const c = d.q ? { x: 0, y: -SPAN * 0.6 } : centre(d); d.x = c.x + (Math.random() - 0.5) * 60; d.y = c.y + (Math.random() - 0.5) * 60; });
      d3.forceSimulation(ALL).stop()
        .force('link', d3.forceLink(E.concat(QE)).distance(60).strength(0.02))
        .force('charge', d3.forceManyBody().strength(-40).distanceMax(400))
        .force('x', d3.forceX(d => d.q ? 0 : centre(d).x).strength(0.12)).force('y', d3.forceY(d => d.q ? -SPAN * 0.6 : centre(d).y).strength(0.12))
        .force('collide', rectCollide(6, false)).tick(500);
    } else if (mode === 'time') {   // a column per lecture, in course order
      const x = d3.scalePoint().domain(decks.map(d => d.id)).range([0, decks.length * 230]);
      ALL.forEach(d => { d.x = d.q ? x.range()[1] / 2 : x(d.deck); d.y = (Math.random() - 0.5) * 300; });
      d3.forceSimulation(ALL).stop().force('link', d3.forceLink(E.concat(QE)).strength(0.01))
        .force('x', d3.forceX(d => d.q ? x.range()[1] / 2 : x(d.deck)).strength(1.5)).force('y', d3.forceY(d => d.q ? -420 : 0).strength(0.04))
        .force('collide', rectCollide(4, true)).tick(400);
    } else {   // rings of prerequisite depth, each lecture in its own sector
      const maxD = d3.max(N, d => d._depth), R = SPAN * 0.9, ang = d3.scaleLinear().domain([0, decks.length]).range([0, 2 * Math.PI]);
      const rr = d => d.q ? R * 1.12 : 80 + (R - 80) * d._depth / maxD;
      ALL.forEach(d => { const a = d.q ? -Math.PI / 2 : ang(di[d.deck] + 0.5); d.x = Math.cos(a) * rr(d); d.y = Math.sin(a) * rr(d); });
      d3.forceSimulation(ALL).stop().force('r', d3.forceRadial(rr, 0, 0).strength(0.8)).force('collide', rectCollide(5, false)).tick(400);
    }
    return Object.fromEntries(ALL.map(d => [d.id, [Math.round(d.x), Math.round(d.y)]]));
  }
  if (BAKE) { window.__layout = { built: new Date().toISOString(), web: compute('web'), time: compute('time'), depth: compute('depth') }; return; }
  if (!L) L = { web: compute('web'), time: compute('time'), depth: compute('depth') };   // fallback when nothing is baked

  // ---------- geometry
  let mode = 'web', k = 1, pinned = null, hovered = null, lit = new Set(), hullDeck = null;
  const off = new Set();
  const edge = edgeG.selectAll('path').data(E).join('path').attr('class', e => 'edge' + (e.back ? ' back' : '')).attr('marker-end', e => `url(#m-${e.back ? 'back' : 'link'})`);
  const qedge = qeG.selectAll('path').data(QE).join('path').attr('class', 'qedge');
  const box = d => d.dot ? [12 / k, 12 / k] : [d.w * (d.s || 1), d.h * (d.s || 1)];
  const edgeOf = (t, dx, dy) => { const [w, h] = box(t), s = Math.min((w / 2 + 3) / Math.abs(dx || 1e-9), (h / 2 + 3) / Math.abs(dy || 1e-9)); return [t.x - dx * s, t.y - dy * s]; };
  const arc = e => { const s = e.source, t = e.target, dx = t.x - s.x, dy = t.y - s.y, [tx, ty] = edgeOf(t, dx, dy), b = mode === 'time' ? 0.2 : 0.1;
    return `M${s.x},${s.y}Q${(s.x + tx) / 2 - dy * b},${(s.y + ty) / 2 + dx * b} ${tx},${ty}`; };
  function shape() {   // a pill with its name, or a dot when the label does not make the cut
    node.select('rect').attr('x', d => -box(d)[0] / 2 / (d.s || 1)).attr('y', d => -box(d)[1] / 2 / (d.s || 1)).attr('width', d => box(d)[0] / (d.s || 1)).attr('height', d => box(d)[1] / (d.s || 1)).attr('rx', d => box(d)[1] / 2 / (d.s || 1));
  }
  function draw() {
    node.attr('transform', d => `translate(${d.x},${d.y}) scale(${d.s || 1})`); qn.attr('transform', d => `translate(${d.x},${d.y}) scale(${Math.max(1, 1 / k)})`);
    edge.attr('d', arc); qedge.attr('d', e => `M${e.source.x},${e.source.y}L${e.target.x},${e.target.y}`);
    hulls();
  }
  // ---------- semantic zoom: far away, only the best-connected concepts keep their label
  function lod() {
    // zoomed out, fewer labels, each drawn at its normal size on screen (like the labels of a map)
    if (k >= 1.05) N.forEach(d => { d.dot = false; d.s = 1; });
    else {   // declutter: most connected first, a label is kept only if it overlaps no kept label on screen
      const placed = [], pad = 4;
      const must = d => d === pinned || d === hovered, first = d => must(d) ? 2 : lit.has(d) ? 1 : 0;
      ranked.slice().sort((a, b) => first(b) - first(a) || a.rank - b.rank).forEach(d => {
        const w = d.w + pad * 2, h = d.h + pad * 2, x = d.x * k, y = d.y * k;
        const free = !placed.some(p => Math.abs(p.x - x) < (p.w + w) / 2 && Math.abs(p.y - y) < (p.h + h) / 2);
        d.dot = !(free || must(d)); d.s = d.dot ? 1 : 1 / k;
        if (!d.dot) placed.push({ x, y, w, h });
      });
    }
    node.classed('dot', d => d.dot); node.filter(d => !d.dot).raise(); shape(); draw();
  }
  const zoom = d3.zoom().scaleExtent([0.06, 3]).on('zoom', e => { root.attr('transform', e.transform); if (Math.abs(e.transform.k - k) > 0.03) { k = e.transform.k; lod(); } });
  svg.call(zoom).on('dblclick.zoom', null);
  const fit = (dur = 700) => { const pts = ALL.map(d => L[mode][d.id]).filter(Boolean); const x0 = d3.min(pts, p => p[0]) - 80, x1 = d3.max(pts, p => p[0]) + 80, y0 = d3.min(pts, p => p[1]) - 60, y1 = d3.max(pts, p => p[1]) + 60;
    const s = Math.min(1.2, 0.95 * Math.min(W / (x1 - x0), (H - 120) / (y1 - y0)));
    svg.transition().duration(dur).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - s * (x0 + x1) / 2, (H + 30) / 2 - s * (y0 + y1) / 2).scale(s)); };
  // switching layouts: glide from where everything is to where the new layout puts it, no simulation
  function layout(m, dur = 900) {
    mode = m; d3.selectAll('.seg button').classed('on', function () { return this.dataset.l === m; });
    ALL.forEach(d => { d.x0 = d.x; d.y0 = d.y; [d.x1, d.y1] = L[m][d.id] || [0, 0]; });
    axes();
    if (!dur) { ALL.forEach(d => { d.x = d.x1; d.y = d.y1; }); draw(); fit(0); return; }
    const ease = d3.easeCubicInOut;
    const t = d3.timer(el => { const u = Math.min(1, el / dur), e = ease(u); ALL.forEach(d => { d.x = d.x0 + (d.x1 - d.x0) * e; d.y = d.y0 + (d.y1 - d.y0) * e; }); draw(); if (u >= 1) t.stop(); });
    fit(dur);
  }
  function axes() {
    axisG.selectAll('*').remove();
    if (mode === 'time') { const x = d3.scalePoint().domain(decks.map(d => d.id)).range([0, decks.length * 230]);
      decks.forEach(d => { const ys = N.filter(n => n.deck === d.id).map(n => (L.time[n.id] || [0, 0])[1]);
        axisG.append('text').attr('x', x(d.id)).attr('y', (d3.max(ys) || 0) + 48).attr('text-anchor', 'middle').attr('fill', col(d.id)).text(d.title.split(':')[0].slice(0, 24)); }); }
    if (mode === 'depth') { const maxD = d3.max(N, d => d._depth), R = SPAN * 0.9;
      d3.range(0, maxD + 1).forEach(j => { const r = 80 + (R - 80) * j / maxD; axisG.append('circle').attr('class', 'ring').attr('r', r);
        axisG.append('text').attr('x', 6).attr('y', -r - 6).text(j === 0 ? 'starting points' : `${j} step${j > 1 ? 's' : ''} in`); }); }
  }
  // a lecture's area: only for the lecture in focus, so the map stays legible
  const hullLine = d3.line().curve(d3.curveCatmullRomClosed.alpha(0.6));
  function hulls() {
    const data = hullDeck && mode === 'web' ? [hullDeck].map(id => { const pts = N.filter(n => n.deck === id).flatMap(n => { const [w, h] = box(n); return [[n.x - w / 2 - 10, n.y - h / 2 - 8], [n.x + w / 2 + 10, n.y - h / 2 - 8], [n.x - w / 2 - 10, n.y + h / 2 + 8], [n.x + w / 2 + 10, n.y + h / 2 + 8]]; });
      return { id, h: pts.length >= 3 ? d3.polygonHull(pts) : null }; }).filter(o => o.h) : [];
    hullG.selectAll('path').data(data, o => o.id).join('path').attr('class', 'hull').attr('d', o => hullLine(o.h))
      .attr('fill', o => col(o.id)).attr('fill-opacity', 0.08).attr('stroke', o => col(o.id)).attr('stroke-opacity', 0.5);
  }

  // ---------- focus: back to the basics, forward to what it unlocks
  const walk = (d, key) => { const s = new Set(), st = [d]; while (st.length) for (const x of st.pop()[key]) if (!s.has(x)) { s.add(x); st.push(x); } return s; };
  function focus(d) {
    hullDeck = d ? d.deck : null;
    if (!d) { lit = new Set(); node.classed('faded', n => off.has(n.deck)); edge.classed('faded', e => off.has(e.source.deck) || off.has(e.target.deck)).classed('up', false).classed('down', false)
      .attr('marker-end', e => `url(#m-${e.back ? 'back' : 'link'})`); qn.classed('faded', false); qedge.classed('faded', false); lod(); hulls(); return; }
    const up = walk(d, 'pre'), down = walk(d, 'post'); lit = new Set([d, ...up, ...down]);
    node.classed('faded', n => !lit.has(n));
    edge.classed('up', e => up.has(e.source) && (e.target === d || up.has(e.target))).classed('down', e => (e.source === d || down.has(e.source)) && down.has(e.target))
      .classed('faded', e => !(lit.has(e.source) && lit.has(e.target)))
      .attr('marker-end', function (e) { return `url(#m-${this.classList.contains('up') ? 'up' : this.classList.contains('down') ? 'down' : e.back ? 'back' : 'link'})`; });
    qn.classed('faded', q => !q.teaches.some(c => lit.has(byId.get(c)))); qedge.classed('faded', e => !lit.has(e.target));
    lod(); hulls();
  }
  function panel(d) {
    const p = d3.select('#panel').classed('on', !!d); if (!d) return;
    const deck = decks[di[d.deck]], up = walk(d, 'pre'), down = walk(d, 'post'), basics = [...up].filter(x => !x.pre.length).map(x => x.name);
    p.html(`<h2>${d.label || d.name}</h2><div class="deck" style="color:${col(d.deck)}">${deck.title}</div>
      ${d.definition ? `<p class="def">${d.definition}</p>` : ''}
      <dl><dt>taught on</dt><dd>${d.slide}</dd>
      <dt>built on</dt><dd>${up.size} concept${up.size === 1 ? '' : 's'}${basics.length ? `, from ${basics.slice(0, 4).join(', ')}` : ''}</dd>
      <dt>unlocks</dt><dd>${down.size} concept${down.size === 1 ? '' : 's'}</dd>
      ${d.wiki ? `<dt>Wikipedia</dt><dd>${d.wiki}</dd>` : ''}</dl>
      <div class="acts"><a class="btn go" href="${d.url}" target="_blank" rel="noopener">Open the slide</a>
      <a class="btn" href="https://www.sematlas.com/q?concept=${d.id}" target="_blank" rel="noopener">On the map</a></div>
      ${d.pre.length ? `<div class="chain">Needs first: ${d.pre.map(x => `<b>${x.name}</b>`).join(', ')}</div>` : '<div class="chain">A starting point: it needs nothing taught before it.</div>'}`);
  }
  node.on('mouseenter', (e, d) => { hovered = d; focus(d); }).on('mouseleave', () => { hovered = null; focus(pinned); })
    .on('click', (e, d) => { pinned = pinned === d ? null : d; node.classed('pin', n => n === pinned); focus(pinned); panel(pinned); })
    .on('dblclick', (e, d) => open(d.url, '_blank'));
  node.call(d3.drag().on('drag', (e, d) => { d.x = e.x; d.y = e.y; draw(); }));   // one box moves; the rest stay put

  // ---------- legend: hover a lecture to see its area, click to hide it
  const leg = d3.select('#legend'), courseTitle = { intro_ml: 'Introduction to Machine Learning', ml4science: 'ML for Science' };
  Object.keys(inCourse).forEach(c => {
    leg.append('li').attr('class', 'cap').text(courseTitle[c] || c);
    inCourse[c].forEach(id => { const d = decks[di[id]];
      leg.append('li').attr('tabindex', 0).html(`<i style="background:${col(id)}"></i><span>${d.title}</span><span class="n">${N.filter(n => n.deck === id).length}</span>`)
        .on('mouseenter', () => { if (!pinned) { hullDeck = id; hulls(); } }).on('mouseleave', () => { if (!pinned) { hullDeck = null; hulls(); } })
        .on('click keydown', function (e) { if (e.type === 'keydown' && e.key !== 'Enter') return; off.has(id) ? off.delete(id) : off.add(id); this.classList.toggle('off'); focus(pinned); }); });
  });
  d3.selectAll('.seg button').on('click', function () { layout(this.dataset.l); });
  d3.select('#stories').on('change', function () { qG.style('display', this.checked ? null : 'none'); qeG.style('display', this.checked ? null : 'none'); });
  d3.select('#q').on('input', function () { const t = this.value.trim().toLowerCase();
    const hit = t && (N.find(n => n.name === t) || N.find(n => n.name.includes(t) || (n.wiki || '').toLowerCase().includes(t)));
    if (hit) { pinned = hit; node.classed('pin', n => n === pinned); focus(hit); panel(hit); const s = 1.1; svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - s * hit.x, H / 2 - s * hit.y).scale(s)); }
    else if (!t) { pinned = null; node.classed('pin', false); focus(null); panel(null); } });
  addEventListener('resize', () => fit(0));
  ALL.forEach(d => { [d.x, d.y] = L.web[d.id] || [0, 0]; });
  layout('web', 0); lod();
})();
</script>
</body>
</html>
